appId: com.lumen.promediacontroller
productName: LUMEN PRO
copyright: Copyright © 2026 LUMEN Broadcast Systems
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
asar: true
asarUnpack:
  - assets/**/*
extraResources:
  - from: assets
    to: assets
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LUMEN PRO
  artifactName: LUMEN-PRO-v${version}-Setup.exe
  uninstallDisplayName: LUMEN PRO
portable:
  artifactName: LUMEN-PRO-v${version}-Portable.exe
  requestExecutionLevel: user
