<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN PRO | Event Media Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0b;
            --panel-bg: #141416;
            --accent-blue: #38bdf8;
            --glow-blue: 0 0 20px rgba(56, 189, 248, 0.5);
            --accent-red: #ef4444;
            --glow-red: 0 0 20px rgba(239, 68, 68, 0.5);
            --accent-green: #22c55e;
            --text-main: #fcfcfc;
            --text-dim: #94a3b8;
            --card-bg: #1c1c1e;
            --border: 1px solid #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: var(--border);
            background: var(--panel-bg);
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-text { font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; }
        .logo-text span { color: var(--accent-blue); }
        .nav-text { font-size: 1.1rem; color: var(--text-dim); font-weight: 400; border-left: 2px solid #333; padding-left: 20px; }

        .header-right { display: flex; align-items: center; gap: 30px; }
        .clock-area { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1rem; color: var(--text-dim); }
        .clock-val { color: var(--text-main); font-weight: 600; }

        /* Top Action Buttons */
        .action-btns { display: flex; gap: 16px; }
        .btn-action {
            height: 48px;
            padding: 0 24px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-live {
            background: var(--accent-blue);
            color: #000;
            box-shadow: var(--glow-blue);
        }
        .btn-live .sub { font-size: 0.6rem; font-weight: 600; opacity: 0.8; }

        .btn-black {
            background: #27272a;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            box-shadow: var(--glow-red);
        }
        .btn-black .sub { font-size: 0.6rem; color: #fff; opacity: 0.6; }

        /* Main Content */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Library Section */
        aside.library {
            background: var(--panel-bg);
            border-right: var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 16px; font-weight: 700; }

        .media-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .media-list::-webkit-scrollbar { width: 4px; }
        .media-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .media-item {
            background: var(--card-bg);
            border-radius: 6px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: 0.2s;
            overflow: hidden;
        }

        .item-row { display: flex; flex-direction: column; }
        .thumb-box { 
            width: 100%; height: 120px; background: #000; position: relative; 
            display: flex; align-items: center; justify-content: center;
        }
        .duration-tag {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold;
        }
        .item-info { padding: 10px; }
        .item-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
        .item-sub { font-size: 0.7rem; color: var(--text-dim); }

        .media-item.selected { border-color: var(--accent-blue); box-shadow: var(--glow-blue); }

        /* Center Viewport */
        main.viewport {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .monitor-bezel {
            flex-grow: 1;
            background: #1c1c1e;
            border-radius: 16px;
            padding: 12px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .mon-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px 12px; font-size: 0.75rem; color: var(--text-dim); }
        .mon-live-tag { color: #fcfcfc; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .mon-live-tag span { width: 6px; height: 6px; background: var(--accent-red); border-radius: 50%; box-shadow: 0 0 8px var(--accent-red); }

        .mon-screen { flex-grow: 1; background: #000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .mon-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .prog-bar-container { height: 4px; width: 100%; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; }
        .prog-bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: #fff; width: 40%; border-radius: 2px; }
        .prog-handle { position: absolute; left: 40%; top: 50%; width: 12px; height: 12px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #000; }

        .mon-controls { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; font-weight: 600; }
        .ctrl-icons { display: flex; gap: 20px; align-items: center; cursor: pointer; }

        /* Bottom Control Bar */
        .bottom-bar {
            background: #1c1c1e;
            border-radius: 12px;
            padding: 20px;
            border: var(--border);
            display: grid;
            grid-template-columns: 180px 1fr 180px;
            gap: 30px;
            align-items: center;
        }

        .playback-btns { display: flex; gap: 15px; justify-content: space-between; }
        .round-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; background: #27272a; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .round-btn:hover { background: #333; border-color: #555; }

        .audio-meters { display: flex; flex-direction: column; gap: 8px; }
        .meter-row { display: flex; align-items: center; gap: 10px; font-size: 0.65rem; color: var(--text-dim); font-weight: 700; }
        .v-meter { flex-grow: 1; height: 10px; background: #000; border-radius: 2px; position: relative; overflow: hidden; }
        .v-fill { position: absolute; left: 0; top: 0; height: 100%; width: 70%; background: linear-gradient(90deg, #22c55e 60%, #eab308 85%, #ef4444 100%); }

        .input-select { display: flex; gap: 10px; background: #000; padding: 4px; border-radius: 8px; }
        .input-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
        .input-btn.active { background: #27272a; color: #fff; border-color: #444; }

        /* Right Panels */
        aside.panels {
            background: var(--panel-bg);
            border-left: var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .p-block { background: #1c1c1e; border-radius: 10px; padding: 15px; border: var(--border); }
        .switch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .toggle { width: 40px; height: 22px; background: #333; border-radius: 11px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle.active { background: var(--accent-green); }
        .toggle.active::after { left: 20px; }

        .ticker-box { background: #000; border: 1px solid var(--accent-blue); border-radius: 6px; padding: 10px; font-size: 0.8rem; height: 80px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

        .scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .scene-btn { background: #27272a; border: 1px solid #333; padding: 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: 0.2s; }
        .scene-btn:hover { background: #333; color: #fff; }

        .preview-content { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo-text">LU<span>MEN</span></div>
            <div class="nav-text">Media Library</div>
        </div>
        <div class="header-right">
            <div class="clock-area">
                <span id="dateDisplay">04/04/2026</span>
                <span style="color: #333;">|</span>
                <div class="clock-val" id="clockDisplay">14:35:10 EST</div>
            </div>
            <div class="action-btns">
                <button class="btn-action btn-live" id="btnGo">
                    GO LIVE
                    <span class="sub">ON AIR | 1h 22m 30s</span>
                </button>
                <button class="btn-action btn-black" id="btnStop">
                    BLACKOUT
                    <span class="sub">EMERGENCY</span>
                </button>
            </div>
        </div>
    </header>

    <div class="workspace">
        <aside class="library">
            <div class="section-label">Media Library</div>
            <ul class="media-list" id="mediaList">
                <!-- Media cards added via JS -->
            </ul>
            <div style="margin-top: 20px; border-top: 1px solid #222; padding-top: 15px;">
                <button id="btnClearLibrary" style="width:100%; background:transparent; color:#555; border:none; font-size:0.7rem; cursor:pointer;">CLEAR RECENT</button>
            </div>
        </aside>

        <main class="viewport">
            <div class="monitor-bezel">
                <div class="mon-header">
                    <div class="mon-live-tag"><span></span> LIVE PREVIEW - Stage Feed | <span id="activeFileName">NO SIGNAL</span></div>
                    <div>12:34:56:01</div>
                </div>
                
                <div class="mon-screen" id="previewMirror">
                    <p style="color: #444; font-weight: 700;">NO CONTENT LIVE</p>
                </div>

                <div class="mon-overlay">
                    <div class="mon-controls">
                        <div>12:34:56:01</div>
                        <div class="ctrl-icons">
                            <span>⏮</span>
                            <span id="btnFreezePreview">▶</span>
                            <span>⏭</span>
                        </div>
                        <div>12:34:58:01</div>
                    </div>
                    <div class="prog-bar-container">
                        <div class="prog-bar-fill" id="progBar"></div>
                        <div class="prog-handle" id="progHandle"></div>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="playback-btns">
                    <button class="round-btn">⏮</button>
                    <button class="round-btn" id="btnPlayBottom">▶</button>
                    <button class="round-btn">⏭</button>
                </div>

                <div class="audio-meters">
                    <div class="meter-row">
                        <div class="v-meter"><div class="v-fill" style="width: 75%;"></div></div>
                    </div>
                    <div class="meter-row">
                        <div class="v-meter"><div class="v-fill" style="width: 60%;"></div></div>
                        <div style="width: 60px;">-10 -15 0</div>
                    </div>
                </div>

                <div class="input-select">
                    <button class="input-btn active">Stage</button>
                    <button class="input-btn">Camera 1/2</button>
                </div>
            </div>
        </main>

        <aside class="panels">
            <div class="section-label">Overlays</div>
            <div class="p-block">
                <div class="switch">
                    <span style="font-size: 0.8rem; font-weight: 600;">Toggle Logo</span>
                    <div class="toggle" id="btnToggleLogo"></div>
                </div>
                <div style="background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent-green); height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--accent-green); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);">
                    EVENT LOGO
                </div>
            </div>

            <div class="section-label">Ticker Text</div>
            <div class="p-block">
                <textarea id="tickerInput" style="width:100%; background:transparent; border:none; color:#fff; font-size:0.8rem; outline:none; height:60px; resize:none;" placeholder="LIVE: Global Tech Summit 2024 - Session 3 starting shortly..."></textarea>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button id="btnUpdateTicker" style="flex:1; background:var(--accent-blue); border:none; padding:8px; border-radius:4px; font-weight:700; font-size:0.7rem; cursor:pointer;">UPDATE</button>
                    <button id="btnHideTicker" style="background:#222; border:none; padding:8px; border-radius:4px; font-weight:700; font-size:0.7rem; color:#555; cursor:pointer;">HIDE</button>
                </div>
            </div>

            <div class="section-label">Scene Select</div>
            <div class="scene-grid">
                <button class="scene-btn">Scene 1</button>
                <div style="background:#222; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#444;">2</div>
                <button class="scene-btn">Scene 3</button>
                <div style="background:#222; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#444;">4</div>
            </div>
            
            <div style="margin-top: auto; text-align: center; color: #222; font-size: 0.6rem; font-weight: 700; letter-spacing: 1px;">
                LUMEN v1.0.0 PROTOTYPE
            </div>
        </aside>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const mediaList = document.getElementById('mediaList');
        const previewMirror = document.getElementById('previewMirror');
        const clockDisplay = document.getElementById('clockDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const activeFileName = document.getElementById('activeFileName');
        
        let selectedMedia = null;

        // Clock & Date Logic
        function updateTime() {
            const now = new Date();
            clockDisplay.innerText = now.toLocaleTimeString('en-GB') + " EST";
            dateDisplay.innerText = now.toLocaleDateString('en-GB');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Simulated Audio Meters
        function animateMeters() {
            const fills = document.querySelectorAll('.v-fill');
            fills.forEach(fill => {
                const randomWidth = 40 + Math.random() * 50; // 40-90%
                fill.style.width = randomWidth + '%';
                fill.style.transition = 'width 0.1s ease-out';
            });
        }
        setInterval(animateMeters, 150);

        // Overlay Controls
        const toggleLogo = document.getElementById('btnToggleLogo');
        toggleLogo.addEventListener('click', () => {
            toggleLogo.classList.toggle('active');
            ipcRenderer.send('control-action', 'TOGGLE_LOGO');
        });

        document.getElementById('btnUpdateTicker').addEventListener('click', () => {
            const text = document.getElementById('tickerInput').value;
            if (text) ipcRenderer.send('control-action', 'UPDATE_TICKER', { text });
        });

        document.getElementById('btnHideTicker').addEventListener('click', () => {
            ipcRenderer.send('control-action', 'HIDE_TICKER');
        });

        // Hotkeys
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; 

            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('btnGo').click();
            } else if (e.code === 'Escape') {
                document.getElementById('btnStop').click();
            } else if (e.code === 'KeyF') {
                ipcRenderer.send('control-action', 'FREEZE');
            }
        });

        // Drag & Drop
        document.body.addEventListener('dragover', (e) => {
            e.preventDefault(); e.stopPropagation();
        });

        document.body.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation();
            for (const f of e.dataTransfer.files) {
                addMediaItem(f.path, f.name);
            }
        });

        function addMediaItem(filePath, fileName, typeFromStorage = null, skipSave = false) {
            let type = typeFromStorage;
            if (!type) {
                const ext = filePath.split('.').pop().toLowerCase();
                type = 'image';
                if (['mp4', 'mov', 'webm', 'mkv'].includes(ext)) type = 'video';
            }

            const li = document.createElement('li');
            li.className = 'media-item';
            li.dataset.path = filePath;
            li.dataset.type = type;
            
            li.innerHTML = `
                <div class="item-row">
                    <div class="thumb-box">
                        <span style="font-size: 2rem; opacity: 0.1;">${type === 'video' ? '▶' : '🖼'}</span>
                        <div class="duration-tag">${type === 'video' ? '03:45' : 'STATIC'}</div>
                    </div>
                    <div class="item-info">
                        <div class="item-title">${fileName}</div>
                        <div class="item-sub">${type.toUpperCase()} • 1920x1080</div>
                    </div>
                </div>
            `;

            li.addEventListener('click', () => {
                document.querySelectorAll('.media-item').forEach(i => i.classList.remove('selected'));
                li.classList.add('selected');
                selectedMedia = { path: filePath, name: fileName, type: type };
            });

            mediaList.appendChild(li);
            if (!skipSave) saveLibrary();
        }

        function saveLibrary() {
            const items = [];
            document.querySelectorAll('.media-item').forEach(li => {
                items.push({
                    path: li.dataset.path,
                    name: li.querySelector('.item-title').innerText,
                    type: li.dataset.type
                });
            });
            localStorage.setItem('lumen-library', JSON.stringify(items));
        }

        function loadLibrary() {
            const data = localStorage.getItem('lumen-library');
            if (data) {
                const items = JSON.parse(data);
                mediaList.innerHTML = '';
                items.forEach(item => {
                    addMediaItem(item.path, item.name, item.type, true);
                });
            }
        }

        document.getElementById('btnClearLibrary').addEventListener('click', () => {
            if (confirm('Xóa sạch thư viện?')) {
                localStorage.removeItem('lumen-library');
                mediaList.innerHTML = '';
            }
        });

        window.addEventListener('DOMContentLoaded', loadLibrary);

        // Control Actions
        document.getElementById('btnGo').addEventListener('click', () => {
            if (selectedMedia) {
                ipcRenderer.send('go-live', selectedMedia);
                activeFileName.innerText = selectedMedia.name;
                
                const oldVideo = previewMirror.querySelector('video');
                if (oldVideo) {
                    oldVideo.pause();
                    oldVideo.src = "";
                    oldVideo.load();
                }
                
                previewMirror.innerHTML = '';
                let content;
                if (selectedMedia.type === 'video') {
                    content = document.createElement('video');
                    content.src = `file://${selectedMedia.path}`;
                    content.autoplay = true;
                    content.loop = true;
                    content.muted = true;
                    content.className = 'preview-content';
                } else {
                    content = document.createElement('img');
                    content.src = `file://${selectedMedia.path}`;
                    content.className = 'preview-content';
                }
                previewMirror.appendChild(content);
            }
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            ipcRenderer.send('control-action', 'BLACK');
            activeFileName.innerText = "BLACKOUT";
            
            const oldVideo = previewMirror.querySelector('video');
            if (oldVideo) {
                oldVideo.pause();
                oldVideo.src = "";
                oldVideo.load();
            }
            previewMirror.innerHTML = '<p style="color: #444; font-weight: 700;">BLACKOUT ACTIVE</p>';
        });

        // Bottom Play/Pause & Freeze
        const btnPlayBottom = document.getElementById('btnPlayBottom');
        const btnFreezePreview = document.getElementById('btnFreezePreview');

        function toggleFreeze() {
            ipcRenderer.send('control-action', 'FREEZE');
            const video = previewMirror.querySelector('video');
            if (video) {
                if (video.paused) {
                    video.play();
                    btnPlayBottom.innerText = "⏸";
                    btnFreezePreview.innerText = "⏸";
                } else {
                    video.pause();
                    btnPlayBottom.innerText = "▶";
                    btnFreezePreview.innerText = "▶";
                }
            }
        }

        btnPlayBottom.addEventListener('click', toggleFreeze);
        btnFreezePreview.addEventListener('click', toggleFreeze);

        ipcRenderer.on('sync-time', (event, stageTime) => {
            const video = previewMirror.querySelector('video');
            if (video && !video.paused) {
                const diff = Math.abs(video.currentTime - stageTime);
                if (diff > 0.3) {
                    video.currentTime = stageTime;
                }
                // Update fake progress bar
                const percent = (video.currentTime / video.duration) * 100;
                document.getElementById('progBar').style.width = percent + '%';
                document.getElementById('progHandle').style.left = percent + '%';
            }
        });
    </script>
</body>
</html>
