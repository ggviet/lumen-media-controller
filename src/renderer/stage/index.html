<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN - Stage Output (Live LED / Projector)</title>
    <link rel="stylesheet" href="styles/stage.css">
</head>
<body>
    <div id="stageContainer">
        <!-- Dual Decks -->
        <div id="deckA" class="media-deck active"></div>
        <div id="deckB" class="media-deck"></div>

        <!-- Safe Logo / Key Visual Layer (Fixed 3-level relative path to assets) -->
        <div id="safeLogoLayer">
            <img id="safeLogoImg" src="../../../assets/sample_keyvisual.svg" alt="Key Visual">
        </div>

        <!-- Watermark / Logo (Fixed 3-level relative path to assets) -->
        <div id="watermarkOverlay">
            <img src="../../../assets/logo.svg" alt="Event Watermark" style="width: 100%; height: auto;">
        </div>

        <!-- Ticker Marquee -->
        <div id="tickerOverlay">
            <div class="ticker-badge">THÔNG BÁO</div>
            <div class="ticker-track">
                <div class="ticker-text" id="tickerContent"></div>
            </div>
        </div>

        <!-- Blackout Cover -->
        <div id="blackoutCover"></div>
    </div>

    <!-- Stage Application Script -->
    <script src="scripts/stage.js"></script>
</body>
</html>
